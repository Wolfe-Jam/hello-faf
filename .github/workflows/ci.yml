name: faf

# hello-faf is a reference: its job is a complete, honest project.faf.
# CI verifies exactly that — the .faf parses, and it still scores 100%.
# This repo is not built or deployed; the manifests exist so `faf` can
# detect a matching stack.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  faf-is-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get FAFb (linux x86_64)
        run: |
          url=https://github.com/Wolfe-Jam/fafb-dist/releases/download/v0.9.0/fafb-0.9.0-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL "$url" -o /tmp/fafb.tgz
          tar -xzf /tmp/fafb.tgz -C /tmp
          sudo install "$(find /tmp -name faf -type f | head -1)" /usr/local/bin/faf
          faf --version

      - name: project.faf validates and scores 100%
        run: |
          faf check project.faf
          faf check project.faf | grep -q "100%" \
            || { echo "::error::project.faf no longer scores 100% — a slot regressed"; exit 1; }
